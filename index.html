<!doctype html>

    <meta name="theme-color" content="#0b0711" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved (or system) theme before first paint, so there is no flash of the wrong theme -->
    <script>
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('pdc-theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#fffbfc' : '#0b0711');
      })();
    </script>
    <title>Pixie Digital Creatives — Creative. Strategic. Impactful.</title>
    <meta name="description" content="Pixie Digital Creatives designs and builds websites, apps, CRM systems, video and content, and runs SEO, GEO, AEO and paid campaigns for growing businesses." />
