<!doctype html>

    <meta name="theme-color" content="#230220" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before first paint, so there is no flash of the wrong theme. Dark is the default. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('pdc-theme-v3');
          if (t !== 'light' && t !== 'dark') t = 'dark';
        } catch (e) { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.add('has-js');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#faf4ee' : '#230220');
      })();
    </script>
    <!-- SEO: home page defaults. `npm run build` rewrites these for every page from src/data/seo.js
         (scripts/prerender-seo.mjs), and components/RouteSeo.jsx keeps them current while browsing. -->
